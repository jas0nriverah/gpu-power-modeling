name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-api.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Synthetic smoke run
        run: >
          python -m gpu_power_pipeline run
          --source synthetic
          --n-samples 500
          --outdir ci_outputs

      - name: Train + persist model
        run: >
          python -m gpu_power_pipeline train
          --source synthetic
          --n-samples 500
          --registry-dir ci_artifacts
          --model-name random_forest

      - name: Predict from saved model
        run: |
          printf 'gpu_utilization_pct,memory_utilization_pct,graphics_clock_mhz,memory_clock_mhz,temperature_c,ambient_c,workload_type\n70,60,1500,5000,65,23,training\n' > sample.csv
          python -m gpu_power_pipeline predict --registry-dir ci_artifacts --model-name random_forest --input sample.csv
